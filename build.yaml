# This file generates the GitHub Actions matrix.
# For simple board + shield combinations, add them to the top level board and
# shield arrays, for more control, add individual board + shield combinations
# to the `include` property. You can also use the `cmake-args` property to
# pass flags to the build command and `artifact-name` to assign a name to
# distinguish build outputs from each other:
#
# board: [ "nice_nano_v2" ]
# shield: [ "corne_left", "corne_right" ]
# include:
#   - board: bdn9_rev2
#   - board: nice_nano_v2
#     shield: reviung41
#   - board: nice_nano_v2
#     shield: corne_left
#     cmake-args: -DCONFIG_ZMK_USB_LOGGING=y
#     artifact-name: corne_left_with_logging
#
---
include:
  - board: seeeduino_xiao_ble
    shield: nickey44a_r rgbled_adapter
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y
    artifact-name: nickey44a_r
  - board: seeeduino_xiao_ble
    shield: nickey44a_l rgbled_adapter
    artifact-name: nickey44a_l
  - board: seeeduino_xiao_ble
    shield: settings_reset
    artifact-name: settings_reset
  # PAD 動作確認用: 右手を USB 接続してシリアルでログを読む版 (Studio なし)
  - board: seeeduino_xiao_ble
    shield: nickey44a_r rgbled_adapter
    snippet: zmk-usb-logging
    cmake-args: -DCONFIG_INPUT_LOG_LEVEL_INF=y -DCONFIG_ZMK_LOG_LEVEL_INF=y -DCONFIG_LOG_PROCESS_THREAD_STARTUP_DELAY_MS=60000 -DCONFIG_LOG_BUFFER_SIZE=16384
    artifact-name: nickey44a_r_logging
  # PAD 動作確認用: NRST/RDY ピンを使わないログ版 (白・黄線が I2C に干渉していないかの確認)
  - board: seeeduino_xiao_ble
    shield: nickey44a_r rgbled_adapter
    snippet: zmk-usb-logging
    cmake-args: -DCONFIG_INPUT_LOG_LEVEL_INF=y -DCONFIG_ZMK_LOG_LEVEL_INF=y -DCONFIG_LOG_PROCESS_THREAD_STARTUP_DELAY_MS=60000 -DCONFIG_LOG_BUFFER_SIZE=16384 -DEXTRA_DTC_OVERLAY_FILE=/tmp/zmk-config/config/tps43_no_rst_rdy_test.overlay
    artifact-name: nickey44a_r_logging_nopins
  # PAD 動作確認用: I2C を白・黄線側に振り替えたログ版 (cross)
  - board: seeeduino_xiao_ble
    shield: nickey44a_r rgbled_adapter
    snippet: zmk-usb-logging
    cmake-args: -DCONFIG_INPUT_LOG_LEVEL_INF=y -DCONFIG_ZMK_LOG_LEVEL_INF=y -DCONFIG_LOG_PROCESS_THREAD_STARTUP_DELAY_MS=60000 -DCONFIG_LOG_BUFFER_SIZE=16384 -DEXTRA_DTC_OVERLAY_FILE=/tmp/zmk-config/config/tps43_cross_test.overlay
    artifact-name: nickey44a_r_logging_cross
  # PAD 動作確認用: I2C を白・黄線側に振り替えたログ版 (cross2)
  - board: seeeduino_xiao_ble
    shield: nickey44a_r rgbled_adapter
    snippet: zmk-usb-logging
    cmake-args: -DCONFIG_INPUT_LOG_LEVEL_INF=y -DCONFIG_ZMK_LOG_LEVEL_INF=y -DCONFIG_LOG_PROCESS_THREAD_STARTUP_DELAY_MS=60000 -DCONFIG_LOG_BUFFER_SIZE=16384 -DEXTRA_DTC_OVERLAY_FILE=/tmp/zmk-config/config/tps43_cross2_test.overlay
    artifact-name: nickey44a_r_logging_cross2
  # PAD 動作確認用: 白線=RDY / 黄線=NRST として扱うログ版
  - board: seeeduino_xiao_ble
    shield: nickey44a_r rgbled_adapter
    snippet: zmk-usb-logging
    cmake-args: -DCONFIG_INPUT_LOG_LEVEL_INF=y -DCONFIG_ZMK_LOG_LEVEL_INF=y -DCONFIG_LOG_PROCESS_THREAD_STARTUP_DELAY_MS=60000 -DCONFIG_LOG_BUFFER_SIZE=16384 -DEXTRA_DTC_OVERLAY_FILE=/tmp/zmk-config/config/tps43_rdyswap_test.overlay
    artifact-name: nickey44a_r_logging_rdyswap
  # PAD 診断用: TPS43 の 4 本の線の状態を調べ、全組み合わせで I2C 応答を探すログ版
  - board: seeeduino_xiao_ble
    shield: nickey44a_r rgbled_adapter
    snippet: zmk-usb-logging
    cmake-args: -DNICKEY_PIN_PROBE=ON -DCONFIG_ZMK_LOG_LEVEL_INF=y -DCONFIG_LOG_PROCESS_THREAD_STARTUP_DELAY_MS=60000 -DCONFIG_LOG_BUFFER_SIZE=32768 -DEXTRA_DTC_OVERLAY_FILE=/tmp/zmk-config/config/tps43_pinprobe.overlay
    artifact-name: nickey44a_r_pinprobe
