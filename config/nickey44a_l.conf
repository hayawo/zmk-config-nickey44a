#Battery config -------------------
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_BATTERY_REPORTING_FETCH_MODE_STATE_OF_CHARGE=y

# Deep Sleep
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=7200000

# TPS43 (Azoteq) input forwarded to the right central
CONFIG_GPIO=y
CONFIG_I2C=y
CONFIG_INPUT=y
CONFIG_ZMK_POINTING=y
CONFIG_INPUT_TPS43=y
# Input processors that invoke behaviors (volume swipe, tab swipe) need
# more than the default 512-byte input thread stack.
CONFIG_INPUT_THREAD_STACK_SIZE=2048

#Bluetooth config -------------------
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
