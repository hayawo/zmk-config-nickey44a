#Battery config -------------------
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_BATTERY_REPORTING_FETCH_MODE_STATE_OF_CHARGE=y

# Deep Sleep
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=7200000

# High-resolution dial (sekigon hires-dial-module), forwarded to the right central
CONFIG_GPIO=y
CONFIG_I2C=y
CONFIG_SENSOR=y
CONFIG_ZMK_HIRES_DIAL=y

#Bluetooth config -------------------
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
